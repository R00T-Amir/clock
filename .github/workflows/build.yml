name: Build ChronoDesk Pro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4  # ارتقا به v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4  # ارتقا به v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore ChronoDesk.csproj

    - name: Build Application
      run: dotnet build ChronoDesk.csproj -c Release --no-restore

    - name: Publish as Single File Executable
      run: dotnet publish ChronoDesk.csproj -c Release -r win-x64 --self-contained false -o publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4  # ارتقا به v4
      with:
        name: ChronoDesk-Pro-Installer
        path: publish/
